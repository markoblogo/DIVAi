<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Съёмка с Режиссёром</title>
<style>
:root{font:16px/1.45 system-ui,sans-serif;color-scheme:dark;background:#15161a;color:#f5f0e9}
*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:24px}
header,.tools,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header{justify-content:space-between;margin-bottom:15px}h1{font-size:clamp(22px,3vw,34px);margin:0}
#mode,.muted{color:#c0bfbf}main{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px}
video{width:100%;aspect-ratio:16/9;background:#0a0a0b;display:block;object-fit:contain}
aside{align-self:start}canvas{width:100%;aspect-ratio:1;display:block;background:#171c1e;border-radius:14px}
aside p{margin:6px 0;text-align:center;font-size:14px}
button,.file,input,textarea{font:inherit;color:inherit}
button,.file{border:1px solid #60636e;background:#292c34;padding:7px 12px;border-radius:5px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.file:focus-within{outline:2px solid #ffd073;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}button.primary{color:#181819;background:#ffd073;border-color:#ffd073}
.tools{margin:12px 0 24px}.file input{position:absolute;width:1px;height:1px;opacity:0}
label.stacked{display:block;font-weight:600;margin:13px 0 5px}
input[type=number],textarea{border:1px solid #68686d;border-radius:5px;background:#202126;padding:8px}
input[type=number]{width:100px}textarea{width:100%;max-width:720px;display:block;resize:vertical}.actions{margin-top:14px}
#status{min-height:1.4em;color:#ffde99}p{margin:8px 0}
@media(max-width:650px){body{padding:14px}main{grid-template-columns:minmax(0,1fr) 72px;gap:7px}aside p{font-size:11px}}
</style>
<header><h1>Съёмка с Режиссёром</h1><span id="mode"></span></header>
<main>
  <video id="clip" controls playsinline preload="metadata"></video>
  <aside><canvas id="face" width="198" height="198" aria-label="Мимика Режиссёра"></canvas><p class="muted">Режиссёр</p></aside>
</main>
<div class="tools"><label class="file">Выбрать видео<input id="file" type="file" accept="video/*,.mov,.m4v,.mp4,.webm"></label><span id="filename"></span></div>
<label class="stacked" for="cue">Момент реакции, сек.</label>
<div class="tools"><input id="cue" type="number" min="0" step="0.01" value="4"><button id="mark" disabled>Отметить здесь</button></div>
<label class="stacked" for="line">Реплика</label>
<textarea id="line" rows="2" maxlength="600">Отлично. Главный герой ушёл из кадра.</textarea>
<div class="actions"><button class="primary" id="start" disabled>Дубль с начала</button><button id="stop" disabled>Стоп</button></div>
<p id="status" role="status"></p>
<script>
'use strict';
const config = __DIVOOM_CONFIG__;
const get = id => document.getElementById(id);
const video = get('clip'), start = get('start'), stop = get('stop'), mark = get('mark');
const cue = get('cue'), line = get('line'), status = get('status');
const canvas = get('face').getContext('2d');
let stage = 'idle', current = null, mediaURL = '', fileKey = '', target = 0, last = 0, fired = false;
let queued = Promise.resolve(), drawn = null;
const tell = message => { status.textContent = message; };
function face(key) {
  if (drawn === key) return;
  config.frames[key].forEach(([r,g,b],i) => {
    canvas.fillStyle = (r || g || b) ? 'rgb('+r+','+g+','+b+')' : '#242a2c';
    canvas.fillRect((i%11)*18+2,Math.floor(i/11)*18+2,14,14);
  });
  drawn = key;
}
function controls() {
  start.disabled = !Number.isFinite(video.duration) || !video.duration;
  stop.disabled = stage === 'idle';
  mark.disabled = start.disabled || stage !== 'idle';
  cue.disabled = line.disabled = stage !== 'idle';
}
async function command(path,data) {
  const req = queued.then(async () => {
    const resp = await fetch('/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Divoom':config.token},body:JSON.stringify(data)});
    const reply = await resp.json();
    if (!resp.ok) throw Error(reply.error || 'Пульт не отвечает.');
    return reply;
  });
  queued = req.catch(()=>{});
  return req;
}
function stopTake(message, pause=true) {
  const id = current;
  current = null; stage = 'idle'; fired = false;
  if (pause) video.pause();
  face('look'); controls(); tell(message);
  if (id) command('stop',{id}).catch(e=>{if(!current)tell(e.message)});
}
function reactionError(id,e) { if (current === id) stopTake(e.message); }
function draftKey() { return 'divoom-shoot:'+fileKey; }
function saveDraft() {
  if (fileKey) try { localStorage.setItem(draftKey(),JSON.stringify([cue.value,line.value])); } catch {}
}
function source(url,name,key) {
  saveDraft(); stopTake('');
  if (mediaURL) URL.revokeObjectURL(mediaURL);
  mediaURL = url.startsWith('blob:') ? url : '';
  fileKey = key;
  cue.value = 4; line.value = 'Отлично. Главный герой ушёл из кадра.';
  try {
    const saved = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if (Array.isArray(saved) && saved.length===2 && typeof saved[1]==='string') [cue.value,line.value] = saved;
  } catch {}
  video.src = url; get('filename').textContent = name; start.disabled = mark.disabled = true;
}
get('file').addEventListener('change',e=>{
  const f = e.target.files[0]; if (!f) return;
  source(URL.createObjectURL(f),f.name,[f.name,f.size,f.lastModified].join('/')); e.target.value='';
});
video.addEventListener('loadedmetadata',()=>{ controls(); tell('Выбери момент и запусти дубль.'); });
video.addEventListener('error',()=>stopTake('Браузер не смог открыть ролик. Попробуй MP4 с видео H.264.'));
mark.onclick = ()=>{cue.value = video.currentTime.toFixed(2); saveDraft();};
cue.onchange = line.onchange = saveDraft;
stop.onclick = ()=>stopTake('Дубль остановлен.');
function returnToStart() {
  if (video.currentTime < .001 && !video.seeking) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const fail=()=>{cleanup();reject(Error('Видео не вернулось к началу. Попробуй ещё раз.'));};
    const done=()=>{cleanup();resolve()};
    const cleanup=()=>{clearTimeout(timer);video.removeEventListener('seeked',done);video.removeEventListener('error',fail)};
    const timer=setTimeout(fail,5000);
    video.addEventListener('seeked',done);video.addEventListener('error',fail);
    video.currentTime=0;
  });
}
start.onclick = async ()=>{
  if (!Number.isFinite(video.duration)) return;
  const point = cue.valueAsNumber, words = line.value.trim();
  if (!(point >= 0 && point < video.duration)) {tell('Момент реакции должен быть в пределах ролика.');return}
  if (!words) {tell('Введи реплику.');return}
  saveDraft(); stopTake('');
  const id = Array.from(crypto.getRandomValues(new Uint8Array(12)), v=>v.toString(16).padStart(2,'0')).join('');
  current=id; stage='preparing'; target=point; last=0; fired=false; controls(); tell('Подготовка дубля…');
  try {
    await Promise.all([command('prepare',{id,line:words}),returnToStart()]);
    if(current!==id)return;
    stage='armed'; tell('Дубль идёт.');
    try {await video.play();} catch {if(current===id)tell('Нажми ▶ на видео, чтобы начать дубль.');}
  } catch(e){reactionError(id,e)}
};
const wait = ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function react(id) {
  stage='reacting'; fired=true; video.pause(); controls(); tell('Режиссёр комментирует.');
  try {
    let state=await command('fire',{id});
    while (current===id) {
      if (state.id!==id) throw Error('Этот дубль сменился другим.');
      if (state.phase==='error') throw Error(state.error);
      face(state.frame);
      if (state.phase==='done') break;
      await wait(95);
      if(current!==id)return;
      const response=await fetch('/state',{cache:'no-store'});
      if (!response.ok) throw Error('Связь с пультом прервалась.');
      state=await response.json();
    }
    if (current!==id)return;
    if(video.ended){stopTake('Дубль завершён. Можно снять следующий.');return}
    stage='after'; controls(); tell('Реплика закончена.');
    try {await video.play();} catch {if(current===id)tell('Нажми ▶ на видео, чтобы продолжить.');}
  } catch(e){reactionError(id,e)}
}
function checkCue() {
  if (stage!=='armed' || fired || video.paused || video.seeking || video.playbackRate<=0) return;
  const now=video.currentTime;
  if (last<=target && now>=target) react(current);
  last=now;
}
function watch() {checkCue();requestAnimationFrame(watch);}
video.addEventListener('timeupdate',checkCue);
video.addEventListener('pause',()=>{
  // A pause event can be queued by the preceding restart after playback resumed.
  if (!video.paused || video.ended) return;
  if (stage==='armed'||stage==='after') stopTake('Дубль поставлен на паузу. Следующий дубль начнётся с начала.');
});
video.addEventListener('play',()=>{
  if(stage==='reacting' && !video.paused)stopTake('Реплика прервана.',false);
});
video.addEventListener('seeking',()=>{
  if (['armed','reacting','after'].includes(stage)) stopTake('Перемотка остановила дубль.');
});
video.addEventListener('ended',()=>{
  if(stage==='armed' && !fired && last<=target && video.currentTime>=target){react(current);return}
  if(current && stage!=='reacting')stopTake('Дубль завершён. Можно снять следующий.');
});
window.addEventListener('pagehide',()=>{
  if(current) fetch('/stop',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json','X-Divoom':config.token},body:JSON.stringify({id:current})}).catch(()=>{});
});
get('mode').textContent=config.preview?'Репетиция без звука':'TimeBox Mini';
face('look'); if(config.demo)source('/demo/take.mp4','Пробный ролик','demo-v1'); else tell('Выбери видео с диска.');
watch();
</script>
</html>
