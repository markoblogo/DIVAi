<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лицо для TimeBox Mini</title>
<style>
:root{color-scheme:light;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:#1b2521;background:#f4f4ed}
*{box-sizing:border-box}body{max-width:970px;margin:auto;padding:36px 23px 50px}
header,footer,.panel{border:1px solid #c6cbbd}header{border-width:0 0 1px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:16px;margin-bottom:24px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.1;letter-spacing:-1.6px;font-weight:690;margin:0}header span{font:13px monospace;color:#526152}
main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:28px;align-items:start}
.device{background:#1d2523;border:1px solid #35423e;padding:8.5%;border-radius:12%;box-shadow:inset 0 0 0 5px #293330,0 4px 5px #1d252321}
.matrix{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:2.2px;background:#101613;touch-action:none}
.pixel{padding:0;border:none;border-radius:2px;min-width:0;width:100%;cursor:crosshair}.pixel:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #147fbc;outline-offset:2px}
.deviceWrap>p{font-size:14px;color:#4e5a53}
fieldset{padding:0;border:0;margin:0 0 17px}legend{font-weight:650;margin:0 0 7px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,input[type=color]{border:1px solid #c1c7bb;border-radius:6px;background:#fbfbf6;color:#25312b;font:inherit;font-size:14px;padding:7px 10px;cursor:pointer}
button:hover{border-color:#687469}button[aria-pressed=true],.primary{background:#213c32;color:white;border-color:#213c32}
input[type=color]{height:34px;width:44px;padding:2px}.dot{width:27px;height:27px;padding:0;border:2px solid #9ca498;border-radius:50%}
footer{margin-top:24px;padding-top:16px;border-width:1px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}#status{font-size:13px;color:#43584b}button:disabled{opacity:.45;cursor:default}
@media(max-width:650px){main{grid-template-columns:1fr}.deviceWrap{width:min(100%,295px);margin:auto}body{padding:18px}header{align-items:end}header span{white-space:nowrap}.controls button{padding:7px 8px}}
</style>
<header><h1>Лицо для TimeBox Mini</h1><span>11 × 11 RGB</span></header>
<main><section class="deviceWrap"><div class="device"><div class="matrix" id="matrix" role="group" aria-label="Пиксели выбранной позы"></div></div>
<p>Выбери позу и цвет. Щёлкни по пикселю или проведи кистью по матрице. Чёрный цвет гасит выбранный пиксель.</p></section>
<section class="panel" style="border:0"><fieldset><legend>Персонаж</legend><div id="characters" class="controls"></div></fieldset>
<fieldset><legend>Поза</legend><div id="poses" class="controls"></div></fieldset>
<fieldset><legend>Ноутбук относительно колонки</legend><div id="sides" class="controls"></div></fieldset>
<fieldset><legend>Кисть</legend><div id="palette" class="controls"><input type="color" id="color" value="#ffa151" aria-label="Точный цвет кисти"></div></fieldset>
<div class="controls"><button id="undo">Отменить штрих</button><button id="reset">Сбросить позу</button><button id="act">Проиграть мимику</button></div>
</section></main><footer><button class="primary" id="save">Скачать observer.json</button><button id="load">Открыть персонажа…</button><input id="file" type="file" accept=".json,application/json" hidden><span id="status" role="status"></span></footer>

function frameEdits(){return changes[face]?.[pose] || {}}
function indexOfEdit(i){return pose==="look" && side==="right" ? i - i%11 + 10 - i%11 : i}
function skinFilename(){return face === "crt" ? "character.json" : face + ".json"}
function nativePixels(){return nativeFaces[face][side][pose]}
function render(){
  const frame=nativePixels(), edits=frameEdits();
  cells.forEach((cell,i)=>{cell.style.backgroundColor=edits[indexOfEdit(i)]||frame[i]});
  for(const [id,value] of [["characters",face],["poses",pose],["sides",side]]){
    for(const b of el(id).children)b.setAttribute("aria-pressed",String(b.dataset.value===value))
  }

}
function addChoices(target,items,setter){for(const [k,v] of Object.entries(items)){const b=document.createElement("button");b.dataset.value=k;b.textContent=v;b.onclick=()=>{stop();setter(k);render()};el(target).append(b)}}
